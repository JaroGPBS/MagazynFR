<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Le Magazynier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="common.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background-color: #1c1c1c;
      font-family: sans-serif;
      color: #f5f5f5;
    }

    .form-wrapper {
      max-width: 500px;
      margin: auto;
      background: #333333;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90vh;
    }

    .logo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .logo-left {
      font-family: 'Informal Roman', cursive;
      color: #f9f9f9;
      line-height: 0.9;
      margin-left: 30px;
    }

    .logo-left .main { font-size: 3rem; }

    .logo-left .sub {
      font-size: 2rem;
      transform: translateY(-11px) translateX(26px);
      opacity: 0.8;
    }

    input {
      margin: 6px 0 20px;
      padding: 10px;
      width: 100%;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input.uppercase { text-transform: uppercase; }
    .hidden { display: none !important; }

    #form-section {
      display: flex;
      flex-direction: column;
      min-height: 58vh;
    }

    button {
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background-color: #666;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background-color: #888; }

    .main-menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .main-menu > button {
      width: 100%;
      height: 52px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .session-card {
      margin: 4px 0 12px;
      padding: 10px 12px;
      border: 1px solid #5d755f;
      border-radius: 8px;
      background: #263628;
    }

    .session-title {
      font-size: 0.78rem;
      font-weight: bold;
      color: #b8d9ba;
      margin-bottom: 4px;
    }

    .session-summary {
      font-size: 0.9rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .session-end-btn {
      width: 100%;
      height: 38px;
      margin-top: 8px;
      padding: 0 10px;
      background: #8a4b24;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .inventory-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .inventory-btn {
      width: 42%;
      height: 34px;
      font-size: 0.85rem;
      font-weight: bold;
      background-color: #8a4b24;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .form-buttons {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .form-buttons button {
      flex: 1;
      height: 48px;
      font-weight: bold;
    }

    .ok-btn { background-color: #2e7d32; }
    .ok-btn:hover { background-color: #3fa344; }
    .back-btn { background-color: #555; }

    .logout-btn {
      background-color: #aa3333;
      width: 75%;
      height: 42px;
      font-size: 0.95rem;
      font-weight: bold;
      margin: auto auto 0 auto;
      display: block;
    }

    .logout-btn:hover { background-color: #cc4444; }

    .footer-logo {
      margin-top: 20px;
      text-align: center;
    }

    .footer-logo img {
      width: 45%;
      max-width: 200px;
      height: auto;
      margin-top: 20px;
    }

    .team-modal,
    .app-dialog {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .team-modal-box,
    .app-dialog-box {
      width: 100%;
      max-width: 380px;
      background: #333;
      border: 1px solid #666;
      border-radius: 16px;
      padding: 20px;
      color: white;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .team-modal-title,
    .app-dialog-title {
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
    }

    .team-modal-subtitle,
    .app-dialog-message {
      font-size: 0.9rem;
      color: #ddd;
      text-align: center;
      line-height: 1.4;
      white-space: pre-line;
      margin-bottom: 16px;
    }

    .team-modal-input {
      background-color: #f2eadf !important;
      color: #1c1c1c !important;
      border: 2px solid #b88a5a !important;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .team-modal-input::placeholder { color: #6b5b4a !important; }

    .team-modal-buttons,
    .app-dialog-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .team-modal-buttons button,
    .app-dialog-buttons button {
      flex: 1;
      height: 46px;
      font-weight: bold;
      border-radius: 10px;
    }

    .team-cancel-btn,
    .app-dialog-cancel { background-color: #555; }

    .team-ok-btn,
    .app-dialog-ok { background-color: #2e7d32; }

    .team-ok-btn:hover,
    .app-dialog-ok:hover { background-color: #3fa344; }
  </style>
</head>

<body>
  <div class="form-wrapper" autocomplete="off">
    <div>
      <div class="logo">
        <div class="logo-left">
          <div class="main">Le Magazynier</div>
          <div class="sub">Belleville</div>
        </div>
      </div>

      <div id="login-section">
        <input type="password" id="kod" placeholder="Kod pracownika" required autocomplete="off">
        <button id="loginBtn" onclick="checkLogin()" style="width:100%;">Zaloguj</button>
      </div>

      <div id="form-section" class="hidden">
        <p>Witaj, <strong id="user-name"></strong>!</p>

        <div id="sessionCard" class="session-card hidden">
          <div class="session-title">AKTYWNA SESJA AUTA</div>
          <div id="sessionSummary" class="session-summary"></div>
          <button class="session-end-btn" onclick="endTransportSession()">Zakończ sesję auta</button>
        </div>

        <div id="main-menu" class="main-menu">
          <button onclick="openTransportOperation('pz.html')">Przyjęcie moduły</button>
          <button onclick="openTransportOperation('wz.html')">Wydanie moduły</button>
          <button onclick="openCzesciTeamModal()">Serwisy</button>
        </div>

        <button id="logoutBtn" class="logout-btn" onclick="logout()">Wyloguj</button>

        <div id="inventoryWrap" class="inventory-wrap">
          <button class="inventory-btn" onclick="window.location.replace('inwentaryzacja.html?v=' + Date.now())">Inwentaryzacja</button>
        </div>

        <div id="route-form" class="hidden">
          <input type="text" id="trasa" class="uppercase" placeholder="NR TRASY" required autocomplete="off">
          <input type="text" id="przewoznik" class="uppercase" placeholder="NAZWA FIRMY PRZEWOŹNIKA" required autocomplete="off">
          <input type="text" id="tablicaSam" class="uppercase" placeholder="TABLICA REJESTRACYJNA SAMOCHODU" required autocomplete="off">
          <input type="text" id="tablicaNacz" class="uppercase" placeholder="TABLICA REJESTRACYJNA NACZEPY" required autocomplete="off">

          <div class="form-buttons">
            <button class="back-btn" onclick="backToMenu()">Cofnij</button>
            <button class="ok-btn" onclick="goToSelected()">OK</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-logo">
      <img src="https://jarogpbs.github.io/MagazynFR/Jaro.png" alt="Created by Jaro">
    </div>
  </div>

  <div id="teamModal" class="team-modal">
    <div class="team-modal-box">
      <div class="team-modal-title">Serwisy</div>
      <div class="team-modal-subtitle">Wpisz nazwę ekipy / trasy</div>
      <input type="text" id="teamModalInput" class="team-modal-input" placeholder="EKIPA / TRASA" autocomplete="off">
      <div class="team-modal-buttons">
        <button class="team-cancel-btn" onclick="closeCzesciTeamModal()">Anuluj</button>
        <button class="team-ok-btn" onclick="confirmCzesciTeam()">OK</button>
      </div>
    </div>
  </div>

  <div id="appDialog" class="app-dialog">
    <div class="app-dialog-box">
      <div id="appDialogTitle" class="app-dialog-title"></div>
      <div id="appDialogMessage" class="app-dialog-message"></div>
      <div class="app-dialog-buttons">
        <button id="appDialogCancel" class="app-dialog-cancel" type="button">Anuluj</button>
        <button id="appDialogOk" class="app-dialog-ok" type="button">OK</button>
      </div>
    </div>
  </div>

<script>
  const users = {
    "2102": "Jarosław J. ",
    "2009": "Krystian M. ",
  };

  let selectedDestination = "";
  let appDialogResolver = null;

  function showAppDialog({ title = "", message = "", okText = "OK", cancelText = "Anuluj", showCancel = false }) {
    return new Promise(resolve => {
      const overlay = document.getElementById("appDialog");
      const titleEl = document.getElementById("appDialogTitle");
      const messageEl = document.getElementById("appDialogMessage");
      const okBtn = document.getElementById("appDialogOk");
      const cancelBtn = document.getElementById("appDialogCancel");

      appDialogResolver = resolve;
      titleEl.textContent = title;
      messageEl.textContent = message;
      messageEl.style.display = message ? "block" : "none";
      okBtn.textContent = okText;
      cancelBtn.textContent = cancelText;
      cancelBtn.style.display = showCancel ? "block" : "none";

      const close = value => {
        overlay.style.display = "none";
        if (appDialogResolver) {
          const resolver = appDialogResolver;
          appDialogResolver = null;
          resolver(value);
        }
      };

      okBtn.onclick = () => close(true);
      cancelBtn.onclick = () => close(false);
      overlay.style.display = "flex";
      setTimeout(() => okBtn.focus(), 50);
    });
  }

  function appAlert(message, title = "Komunikat", okText = "OK") {
    return showAppDialog({ title, message, okText, showCancel: false });
  }

  function appConfirm(message, title = "Potwierdzenie", okText = "OK", cancelText = "Anuluj") {
    return showAppDialog({ title, message, okText, cancelText, showCancel: true });
  }

  function checkLogin() {
    const kod = document.getElementById("kod").value.trim();
    const login = users[kod];

    if (!login) {
      appAlert("Niepoprawny kod pracownika.", "Błąd");
      return;
    }

    localStorage.setItem("login", login);
    document.getElementById("user-name").textContent = login;
    document.getElementById("form-section").classList.remove("hidden");
    document.getElementById("login-section").classList.add("hidden");
    showMenu();
  }

  function hasActiveTransportSession() {
    return !!(
      getTransportSessionId() &&
      localStorage.getItem("trasa") &&
      localStorage.getItem("przewoznik") &&
      localStorage.getItem("tablica")
    );
  }

  function updateSessionCard() {
    const card = document.getElementById("sessionCard");
    const summary = document.getElementById("sessionSummary");
    if (!card || !summary) return;

    if (!hasActiveTransportSession()) {
      card.classList.add("hidden");
      summary.textContent = "";
      return;
    }

    const trasa = localStorage.getItem("trasa") || "";
    const przewoznik = localStorage.getItem("przewoznik") || "";
    const tablica = localStorage.getItem("tablica") || "";
    summary.textContent = `${trasa} • ${przewoznik} • ${tablica}`;
    card.classList.remove("hidden");
  }

  function showMenu() {
    selectedDestination = "";
    document.getElementById("main-menu").classList.remove("hidden");
    document.getElementById("route-form").classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");

    const inventoryWrap = document.getElementById("inventoryWrap");
    if (inventoryWrap) inventoryWrap.classList.remove("hidden");

    updateSessionCard();
  }

  function openTransportOperation(destination) {
    if (hasActiveTransportSession()) {
      goToDestination(destination);
      return;
    }

    showRouteForm(destination);
  }

  function showRouteForm(destination) {
    selectedDestination = destination;
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("route-form").classList.remove("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");

    const inventoryWrap = document.getElementById("inventoryWrap");
    if (inventoryWrap) inventoryWrap.classList.add("hidden");
  }

  function goToDestination(destination) {
    const trasa = localStorage.getItem("trasa") || "";
    const przewoznik = localStorage.getItem("przewoznik") || "";
    const tablica = localStorage.getItem("tablica") || "";

    if (!trasa || !przewoznik || !tablica) {
      clearTransportSessionId();
      showRouteForm(destination);
      return;
    }

    const url = `${destination}?trasa=${encodeURIComponent(trasa)}&przewoznik=${encodeURIComponent(przewoznik)}&tablica=${encodeURIComponent(tablica)}&v=${Date.now()}`;
    window.location.replace(url);
  }

  function backToMenu() {
    showMenu();
  }

  function goToSelected() {
    if (!selectedDestination) {
      appAlert("Nie wybrano operacji.", "Brak operacji");
      return;
    }

    const trasa = document.getElementById("trasa").value.trim().toUpperCase();
    const przewoznik = document.getElementById("przewoznik").value.trim().toUpperCase();
    const tablicaSam = document.getElementById("tablicaSam").value.trim().toUpperCase();
    const tablicaNacz = document.getElementById("tablicaNacz").value.trim().toUpperCase();

    if (!trasa || !przewoznik || !tablicaSam || !tablicaNacz) {
      appAlert("Proszę uzupełnić wszystkie pola.", "Brak danych");
      return;
    }

    const tablicaCombined = `${tablicaSam} / ${tablicaNacz}`;
    localStorage.setItem("trasa", trasa);
    localStorage.setItem("przewoznik", przewoznik);
    localStorage.setItem("tablica", tablicaCombined);
    localStorage.setItem("tablicaSam", tablicaSam);
    localStorage.setItem("tablicaNacz", tablicaNacz);
    ensureTransportSessionId();
    goToDestination(selectedDestination);
  }

  function hasSavedArray(key) {
    try {
      const parsed = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(parsed) && parsed.length > 0;
    } catch (_) {
      return false;
    }
  }

  async function endTransportSession() {
    const hasUnsent =
      hasSavedArray("codesPZ") ||
      hasSavedArray("partsPZTest") ||
      hasSavedArray("codesWZ") ||
      hasSavedArray("partsWZ");

    const message = hasUnsent
      ? "Masz niewysłane dane PZ lub WZ. Zakończenie sesji usunie te niewysłane dane."
      : "Zakończyć sesję tego auta?";

    const ok = await appConfirm(message, "Zakończyć sesję?", "Zakończ", "Anuluj");
    if (!ok) return;

    localStorage.removeItem("codesPZ");
    localStorage.removeItem("partsPZTest");
    localStorage.removeItem("codesWZ");
    localStorage.removeItem("partsWZ");
    localStorage.removeItem("trasa");
    localStorage.removeItem("przewoznik");
    localStorage.removeItem("tablica");
    localStorage.removeItem("tablicaSam");
    localStorage.removeItem("tablicaNacz");
    clearTransportSessionId();

    document.getElementById("trasa").value = "";
    document.getElementById("przewoznik").value = "";
    document.getElementById("tablicaSam").value = "";
    document.getElementById("tablicaNacz").value = "";
    showMenu();
  }

  async function finishTransportSessionPretty() {
    if (!getTransportSessionId()) return;

    const hasPz = hasTransportDraft("pz");
    const hasWz = hasTransportDraft("wz");
    const hasData = hasPz || hasWz;

    const confirmed = await appConfirm(
      "",
      hasData ? "Zakończyć i wysłać?" : "Zakończyć sesję?",
      hasData ? "Wyślij" : "Zakończ",
      "Anuluj"
    );

    if (!confirmed) return;

    const button = document.querySelector(".session-end-btn");
    const oldText = button ? button.textContent : "";

    if (button) {
      button.disabled = true;
      button.textContent = hasData ? "Wysyłam..." : "Kończę...";
    }

    try {
      let pzNumber = "";
      let wzNumber = "";

      if (hasPz) {
        const pzResult = await sendTransportDraft_("pz");
        if (pzResult) pzNumber = pzResult.documentNumber || "PZ";
      }

      if (hasWz) {
        const wzResult = await sendTransportDraft_("wz");
        if (wzResult) wzNumber = wzResult.documentNumber || "WZ";
      }

      clearFinishedTransportSession_();

      if (wzNumber || pzNumber) {
        const lines = [];
        if (wzNumber) lines.push(`Zapisano ${wzNumber}`);
        if (pzNumber) lines.push(`${wzNumber ? "         " : "Zapisano "}${pzNumber}`);
        await appAlert(lines.join("\n"), "Dane wysłane.");
      } else {
        await appAlert("Sesja została zakończona.", "Gotowe");
      }

      const routeFields = ["trasa", "przewoznik", "tablicaSam", "tablicaNacz"];
      routeFields.forEach(id => {
        const element = document.getElementById(id);
        if (element) element.value = "";
      });

      showMenu();
    } catch (err) {
      const messageText = err && err.message ? err.message : String(err);
      await appAlert(messageText + "\n\nNiewysłane dane pozostały zapisane.", "Nie udało się wysłać");
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = oldText || "Zakończ sesję";
      }
    }
  }

  function openCzesciTeamModal() {
    const modal = document.getElementById("teamModal");
    const input = document.getElementById("teamModalInput");
    const saved = localStorage.getItem("serwisEkipa") || "";
    input.value = saved;
    modal.style.display = "flex";
    setTimeout(() => input.focus(), 100);
  }

  function closeCzesciTeamModal() {
    const modal = document.getElementById("teamModal");
    const input = document.getElementById("teamModalInput");
    input.value = "";
    modal.style.display = "none";
  }

  function confirmCzesciTeam() {
    const input = document.getElementById("teamModalInput");
    const cleanEkipa = input.value.trim().toUpperCase();

    if (!cleanEkipa) {
      appAlert("Musisz wpisać nazwę ekipy / trasy.", "Brak ekipy");
      return;
    }

    localStorage.setItem("serwisEkipa", cleanEkipa);
    window.location.replace("czesci.html?v=" + Date.now());
  }

  function logout() {
    localStorage.removeItem("login");
    localStorage.removeItem("serwisEkipa");

    document.getElementById("form-section").classList.add("hidden");
    document.getElementById("login-section").classList.remove("hidden");
    document.getElementById("kod").value = "";
    closeCzesciTeamModal();
  }

  document.addEventListener("DOMContentLoaded", () => {
    sessionStorage.removeItem("clearInputsAfterSend");

    const login = localStorage.getItem("login");
    if (login) {
      document.getElementById("user-name").textContent = login;
      document.getElementById("form-section").classList.remove("hidden");
      document.getElementById("login-section").classList.add("hidden");
      showMenu();
    }

    const teamInput = document.getElementById("teamModalInput");
    if (teamInput) {
      teamInput.addEventListener("input", () => {
        teamInput.value = teamInput.value.toUpperCase();
      });

      teamInput.addEventListener("keydown", e => {
        if (e.key === "Enter") confirmCzesciTeam();
        if (e.key === "Escape") closeCzesciTeamModal();
      });
    }

    window.endTransportSession = finishTransportSessionPretty;
  });
</script>
</body>
</html>
